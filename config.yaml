random_seed: 42

spatial:
  target_crs: "EPSG:32613"

paths:
  data_dir: "Datos"
  legacy_results_dir: "Resultados"
  outputs_dir: "outputs"

scenario_status:
  candidate_plots: "synthetic"
  cfe_substations: "synthetic_assumption"
  jmas_outlets: "synthetic_assumption"
  hazards: "synthetic_assumption"
  traffic: "synthetic_experiment_enabled_not_observed_historical_traffic"

stgnn:
  window: 12
  target_column: "travel_time_min"
  gcn_hidden: 32
  gru_hidden: 64
  gru_layers: 1
  learning_rate: 0.001
  batch_size: 64
  weight_decay: 0.00001
  epochs: 200
  early_stopping_patience: 20

synthetic_traffic:
  enabled: true
  node_count: 64
  periods: 240
  frequency: "h"
  start_timestamp: "2026-01-01 00:00:00"
  base_speed_kph: 48.0
  noise_std_kph: 1.75
  output_dir: "outputs/synthetic"

optimization:
  solver: "CBC"
  alpha_cfe_distance: 1.0
  beta_jmas_distance: 1.0
  gamma_bridge_travel: 2.0
  delta_worker_commute_profile3: 2500.0

sensitivity:
  variations:
    - -0.30
    - -0.20
    - -0.10
    - 0.00
    - 0.10
    - 0.20
    - 0.30
