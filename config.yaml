random_seed: 42

spatial:
  target_crs: "EPSG:32613"

paths:
  data_dir: "Datos"
  legacy_results_dir: "Resultados"
  outputs_dir: "outputs"

scenario_status:
  candidate_plots: "synthetic"
  cfe_substations: "synthetic_assumption"
  jmas_outlets: "synthetic_assumption"
  hazards: "synthetic_assumption"
  traffic: "stgnn_training_requires_empirical_temporal_traffic_data"

stgnn:
  window: 12
  gcn_hidden: 32
  gru_hidden: 64
  gru_layers: 1
  learning_rate: 0.001
  batch_size: 64
  weight_decay: 0.00001
  epochs: 200
  early_stopping_patience: 20

optimization:
  solver: "CBC"
  alpha_cfe_distance: 1.0
  beta_jmas_distance: 1.0
  gamma_bridge_travel: 2.0

sensitivity:
  variations:
    - -0.30
    - -0.20
    - -0.10
    - 0.00
    - 0.10
    - 0.20
    - 0.30
